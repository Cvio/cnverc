[package]
name = "cnverc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Offline speech-to-speech translation. No internet, no services, no toolchain."
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sherpa-onnx = "1.13.8"
cpal = "0.16.0"
hound = "3.5.1"
# default features pull in openmp, which links VCOMP140.DLL from the Visual C++
# redistributable — a runtime dependency a freshly imaged machine may not have
# (SPEC §2.6). llama.cpp has its own threadpool and does not need it.
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["common"] }
encoding_rs = "0.8.35"
toml_edit = "0.22"
eframe = "0.36"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
