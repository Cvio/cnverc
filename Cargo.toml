[package]
name = "convers"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Offline speech-to-speech translation. No internet, no services, no toolchain."
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
